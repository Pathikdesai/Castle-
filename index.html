<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Castles Reforged: a browser remake of the 2001 artillery game Castles v1.5 for 2 to 5 players.">
<title>Castles Reforged</title>
<style>[hidden]{display:none!important} img{max-width:100%} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
:root{
  --wood:#1f150e; --wood2:#2c1f16; --wood3:#3a2a1d; --line:#56402d;
  --parch:#efe1c1; --parch2:#f7edd6; --ink:#2b1d11; --ink2:#5c4631; --rule:#b99a64;
  --gilt:#d9a93d; --gilt2:#f1cd73; --ember:#b8472a; --ember2:#d45e37; --muted:#b3a080;
  --display:'Pirata One', 'Palatino Linotype', Georgia, serif;
  --body:'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --caps:'Alegreya Sans SC', 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{margin:0;background:var(--wood);color:var(--parch);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gilt2);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-inline:16px;box-sizing:border-box}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
#players{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 320px;min-width:0}
.pchip{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:9px;row-gap:4px;align-items:center;padding:6px 10px;background:var(--wood2);border:1px solid var(--line);border-radius:3px;min-width:130px;flex:0 1 170px;transition:border-color .2s,opacity .3s}
.pchip.active{border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt)}
.pchip.dead{opacity:.42}
.pchip.dead .nm{text-decoration:line-through}
.shield{width:17px;height:21px;grid-row:span 2;background:var(--c);clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.pname{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;line-height:1.1;min-width:0}
.pname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .meta{display:flex;gap:6px;flex:0 0 auto}
.gold{color:var(--gilt2);font-variant-numeric:tabular-nums}
.wins{color:var(--gilt);font-size:12px;letter-spacing:1px}
.hpbar{height:5px;background:#0f0905;border-radius:3px;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:var(--c);transition:width .35s ease}

#turnbox{display:flex;align-items:center;gap:10px}
.turntext{display:flex;flex-direction:column;line-height:1.1}
#roundlbl{font-family:var(--caps);font-size:12px;letter-spacing:.08em;color:var(--muted)}
#turnname{font-family:var(--display);font-size:24px;color:var(--parch)}

#windbox{display:flex;flex-direction:column;gap:4px;min-width:124px}
#windbox .lbl{display:flex;justify-content:space-between;font-family:var(--caps);font-size:12px;letter-spacing:.08em;color:var(--muted)}
#windval{color:var(--parch);font-variant-numeric:tabular-nums}
.wbar{position:relative;height:8px;background:#0f0905;border-radius:4px;overflow:hidden}
.wbar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#9cc3e6,#e8f2fb);transition:left .5s,width .5s}
.wbar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}

.sys{display:flex;gap:6px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;background:var(--wood2);border:1px solid var(--line);border-radius:3px;color:var(--parch);padding:0}
.iconbtn:hover{border-color:var(--gilt)}
.iconbtn svg{width:18px;height:18px}

/* ---------- stage ---------- */
#stage{flex:1 1 0;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden}
#cv{display:block;touch-action:none;border-radius:3px;box-shadow:0 0 0 1px var(--line),0 14px 40px rgba(0,0,0,.45);cursor:crosshair}

/* ---------- tray ---------- */
#tray{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
#weapons{display:flex;gap:5px;overflow-x:auto;flex:1 1 360px;min-width:0;padding-block:2px;scrollbar-width:thin;align-items:center}
.tsep{flex:0 0 auto;width:1px;height:40px;background:var(--line);margin-inline:5px}
.wbtn{position:relative;flex:0 0 auto;width:50px;height:50px;display:grid;place-items:center;padding:0;background:var(--wood2);border:1px solid var(--line);border-radius:3px;color:var(--parch)}
.wbtn img{width:36px;height:36px}
.wbtn .key{position:absolute;left:4px;top:2px;font-size:11px;color:var(--muted)}
.wbtn .cnt{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.wbtn.sel{background:var(--wood3);border-color:var(--gilt);box-shadow:inset 0 0 0 1px var(--gilt)}
.wbtn:disabled{cursor:default}
.wbtn:disabled:not(.sel){opacity:.34}
#aimctl{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;flex:1 1 420px;min-width:0}
.ctl{display:flex;align-items:center;gap:6px;flex:1 1 220px;min-width:0}
.ctlname{font-family:var(--caps);font-size:13px;letter-spacing:.06em;color:var(--muted);min-width:86px;font-variant-numeric:tabular-nums}
.ctlname b{color:var(--parch);font-weight:700}
.ctl input[type=range]{flex:1 1 auto;min-width:0;height:30px;accent-color:var(--gilt);cursor:pointer}
.step{flex:0 0 auto;width:38px;height:38px;display:grid;place-items:center;padding:0;background:var(--wood2);border:1px solid var(--line);border-radius:3px;color:var(--parch);font-size:16px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.step:hover:not(:disabled){border-color:var(--gilt)}
.step:disabled,.ctl input:disabled{opacity:.4;cursor:default}
.rotate-tip{display:none;font-size:13px;color:var(--muted);flex-basis:100%}
@media (orientation:portrait) and (max-width:640px){.rotate-tip{display:block}}
#wname{font-family:var(--display);font-size:22px;min-width:120px}
#btnFire{font-family:var(--display);font-size:24px;line-height:1;padding:10px 26px;background:var(--ember);color:#fff3df;border:1px solid #6d2511;border-radius:3px;box-shadow:inset 0 -3px rgba(0,0,0,.22)}
#btnFire:hover:not(:disabled){background:var(--ember2)}
#btnFire:disabled{opacity:.4;cursor:default}

/* ---------- overlays ---------- */
#ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;overflow:auto;background:rgba(16,10,5,.5)}
.card{width:100%;max-width:780px;box-sizing:border-box;padding:30px 34px;color:var(--ink);border-radius:2px;
  background:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(150,110,50,.18),transparent 55%),var(--parch);
  box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 0 0 1px var(--rule),inset 0 0 0 6px var(--parch),inset 0 0 0 7px var(--rule);
  display:flex;flex-direction:column;gap:18px}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,9vw,84px);line-height:.85;margin:0;color:var(--ink)}
.card h2{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:0;text-wrap:balance}
.card h3{font-family:var(--caps);font-size:14px;letter-spacing:.12em;color:var(--ink2);margin:6px 0 0;font-weight:700}
.card p{margin:0;line-height:1.45;max-width:64ch}
.eyebrow{font-family:var(--caps);font-size:13px;letter-spacing:.14em;color:var(--ember);font-weight:700}
.mast{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.mast .sub{font-family:var(--caps);letter-spacing:.1em;color:var(--ink2);padding-bottom:8px}
.lords{display:grid;gap:8px}
.lord{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,170px);gap:10px;align-items:center}
.lord .shield{width:20px;height:25px;grid-row:auto}
.lord input,.lord select,.opts select{width:100%;box-sizing:border-box;background:var(--parch2);color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:8px 10px}
.lord.off input{opacity:.45}
.opts{display:flex;gap:12px 20px;flex-wrap:wrap}
.opts label{display:flex;flex-direction:column;gap:4px;font-family:var(--caps);font-size:13px;letter-spacing:.08em;color:var(--ink2);min-width:150px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--display);font-size:24px;line-height:1;padding:11px 26px;border-radius:2px;border:1px solid #6d2511;background:var(--ember);color:#fff3df;box-shadow:inset 0 -3px rgba(0,0,0,.2)}
.btn:hover{background:var(--ember2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink2);box-shadow:none}
.btn.ghost:hover{background:rgba(92,70,49,.1)}
.err{color:#9b2c16;font-weight:700}
.codeform{display:grid;gap:6px;border-top:1px solid var(--rule);padding-top:14px}
.codeform label{font-family:var(--caps);font-size:13px;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.coderow{display:flex;gap:8px}
.coderow input{flex:1 1 auto;min-width:0;background:var(--parch2);color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;font-size:16px}
.coderow .btn{font-size:20px;padding:8px 18px}
#codeMsg{min-height:1.4em;color:var(--ink2)}
.how summary{cursor:pointer;font-family:var(--caps);letter-spacing:.08em;color:var(--ink2);font-weight:700}
.how ul{margin:10px 0 0;padding-left:20px;line-height:1.55;display:grid;gap:2px}
kbd{font-family:var(--body);font-size:13px;background:var(--parch2);border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 5px}
.shophead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.shophead .shield{width:34px;height:42px;flex:0 0 auto}
.purse{font-size:28px;font-weight:700;color:#7a5410;font-variant-numeric:tabular-nums;margin-left:auto}
.wares{display:grid;gap:6px}
.ware{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 10px;border:1px solid rgba(185,154,100,.6);border-radius:2px;background:rgba(255,250,235,.45)}
.ware img{width:44px;height:44px;flex:0 0 auto;background:#2c1f16;border-radius:2px}
.ware .wtxt{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ware .wtxt b{font-size:17px}
.ware .wtxt span{font-size:14px;color:var(--ink2)}
.ware .buy{display:flex;align-items:center;gap:8px;margin-left:auto}
.ware .own{font-size:13px;color:var(--ink2);min-width:58px;font-variant-numeric:tabular-nums}
.ware .price{font-weight:700;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.ware button{background:var(--wood2);color:var(--parch);border:1px solid var(--wood);border-radius:2px;padding:5px 10px;font-weight:700}
.ware button:disabled{opacity:.35;cursor:default}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--caps);font-size:12px;letter-spacing:.08em;color:var(--ink2);text-align:right;padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:8px;text-align:right;border-bottom:1px solid rgba(185,154,100,.45);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td .shield{display:inline-block;width:12px;height:15px;vertical-align:-2px;margin-right:6px}
tr.win td{font-weight:700}

@media (max-width:640px){
  #app{gap:6px;padding-block:6px}
  .pchip{min-width:0;flex:1 1 120px;padding:5px 8px}
  #windbox{min-width:100px}
  #turnname{font-size:20px}
  .card{padding:22px 18px}
  .lord{grid-template-columns:20px minmax(0,1fr) minmax(0,130px)}
  #aimctl{flex-basis:100%}
  #btnFire{flex:1 1 100%;padding-block:14px}
  .step{width:44px;height:44px}
  .wbtn{width:46px;height:46px}.wbtn img{width:32px;height:32px}
}
/* phones held sideways: a slim top row, controls in a side panel, and the rest for the battlefield */
@media (orientation: landscape) and (max-height: 540px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 214px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage tray";gap:6px 10px;padding-block:6px;padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px))}
  #topbar{grid-area:top;flex-wrap:nowrap;gap:8px}
  #players{flex-wrap:nowrap;flex:1 1 auto;gap:5px}
  .pchip{flex:1 1 0;min-width:0;padding:3px 7px;row-gap:2px;column-gap:6px}
  .pname{font-size:12px}
  .pchip .shield{width:12px;height:15px}
  .wins{display:none}
  #turnbox{display:none}
  #windbox{min-width:92px;gap:2px}
  .iconbtn{width:30px;height:30px}
  #stage{grid-area:stage}
  #tray{grid-area:tray;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:6px;min-height:0}
  #aimctl{order:1;flex:0 0 auto;flex-direction:column;align-items:stretch;gap:4px}
  #wname{font-size:18px;min-width:0;line-height:1}
  .ctl{flex:0 0 auto;gap:2px 4px;flex-wrap:wrap}
  .ctlname{min-width:0;flex:1 1 100%;font-size:11px;line-height:1.1}
  .ctl input[type=range]{flex:1 1 0;width:0;height:26px}
  .step{width:30px;height:30px}
  #btnFire{order:2;flex:0 0 auto;padding:7px 10px;font-size:22px}
  #weapons{order:3;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;flex-wrap:wrap;align-content:flex-start;gap:4px}
  .wbtn{width:38px;height:38px}
  .wbtn img{width:28px;height:28px}
  .wbtn .key{display:none}
  .tsep{flex-basis:100%;width:auto;height:1px;margin:2px 0}
  .rotate-tip{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="players" aria-label="Lords"></div>
    <div id="turnbox">
      <div class="turntext"><span id="roundlbl">Exhibition bout</span><span id="turnname">—</span></div>
    </div>
    <div id="windbox" aria-label="Wind">
      <div class="lbl"><span>Wind</span><span id="windval">0</span></div>
      <div class="wbar"><i id="windfill"></i></div>
    </div>
    <div class="sys">
      <button class="iconbtn" id="btnFull" type="button" aria-label="Full screen" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
      </button>
      <button class="iconbtn" id="btnSound" type="button" aria-label="Mute sound"></button>
      <button class="iconbtn" id="btnPause" type="button" aria-label="Pause">
        <svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>
      </button>
    </div>
  </header>
  <main id="stage"><canvas id="cv" aria-label="Battlefield"></canvas></main>
  <footer id="tray">
    <div id="weapons" role="toolbar" aria-label="Weapons"></div>
    <div id="aimctl">
      <span id="wname">Cannonball</span>
      <div class="ctl">
        <span class="ctlname">Angle <b id="rAng">60°</b></span>
        <button type="button" class="step" data-k="ang" data-d="1" aria-label="Turn sight left">◀</button>
        <input type="range" id="angR" min="0" max="180" step="1" value="120" aria-label="Aim direction">
        <button type="button" class="step" data-k="ang" data-d="-1" aria-label="Turn sight right">▶</button>
      </div>
      <div class="ctl">
        <span class="ctlname">Power <b id="rPow">60</b></span>
        <button type="button" class="step" data-k="pow" data-d="-1" aria-label="Less power">−</button>
        <input type="range" id="powR" min="1" max="100" step="1" value="60" aria-label="Power">
        <button type="button" class="step" data-k="pow" data-d="1" aria-label="More power">+</button>
      </div>
      <span class="rotate-tip">Turn your phone sideways for a bigger battlefield.</span>
    </div>
    <button id="btnFire" type="button">Fire</button>
  </footer>
</div>
<div id="ov" hidden></div>

<script>
(() => {
'use strict';
// ================= constants =================
// VW is the visible view; W is the whole battlefield, twice as wide, panned with the camera.
const VW = 1280, W = 2560, H = 720, G = 330, DT = 1/60, WIND_MAX = 75, POWER_K = 9.2, DEATH = 0.38;
const CLOUD_W = VW + (W - VW)*.6 + 400, BGP = .5, BGW = VW + (W - VW)*BGP, MM_W = 280, MM_H = Math.round(MM_W*H/W), MG_TIME = 6;
const BALLOON_FIRE = 6, BALLOON_RATE = .12;
const SHIELD_R = 114, UPGRADE_PRICE = 120, UPGRADE_MAX = 2;
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

const HERALD = [
  { col:'#c63a2c', dark:'#7a1c14', light:'#f07a62' },
  { col:'#2e6cb8', dark:'#173b6b', light:'#78abea' },
  { col:'#3d8d4b', dark:'#1d5227', light:'#7fcb8c' },
  { col:'#d9a31f', dark:'#86600b', light:'#f5d06a' },
  { col:'#7d4aa8', dark:'#45236a', light:'#b98fdc' },
];

// The first ten are the original shareware arsenal (keys 1–0); the rest stand in for the registered edition.
const WEAPONS = [
  { id:'arrow',        name:'Arrow',          price:0,  r:9,  wind:1.25, desc:'The simplest missile. You never run out.' },
  { id:'bigarrow',     name:'Big Arrow',      price:40, r:32, wind:.3, grav:1.35, desc:'Very heavy and very powerful. Drops fast and shrugs off the wind.' },
  { id:'grenade',      name:'Grenade',        price:15, r:24, wind:.6,  desc:'Bounces off the ground and explodes only when it hits a castle.' },
  { id:'supergrenade', name:'Super Grenade',  price:45, r:20, wind:.6,  desc:'Bursts 2.5 seconds after launch, wherever it is, and scatters six small grenades.' },
  { id:'missile',      name:'Direct Missile', price:30, r:24, wind:0,   desc:'Flies in a straight line. Gravity and wind do not touch it.' },
  { id:'balloon',      name:'Balloon',        price:50, r:12, wind:.6, imm:1.4, desc:'Rises, drifts across the sky and rains a steady stream of pellets until it leaves the field. Power sets its speed.' },
  { id:'defense',      name:'Defense',        price:35, r:0,  wind:0,   desc:'Raises a shield over your castle that stops two direct hits. Uses your turn.' },
  { id:'grounddef',    name:'Ground Defense', price:20, r:0,  wind:.6,  desc:'Throws up a hill in the path of enemy fire.' },
  { id:'ballgrenade',  name:'Ball Grenade',   price:35, r:34, wind:.5,  desc:'Ricochets hard off the ground and hits a castle for severe damage.' },
  { id:'gimlet',       name:'Gimlet',         price:25, r:0,  wind:.5,  desc:'Bores a long tunnel without hurting castles. Dig out the ground under a castle and it falls.' },
  { id:'ball',         name:'Cannonball',     price:10, r:22, wind:.6,  desc:'Iron shot. The honest workhorse of any siege.' },
  { id:'fire',         name:'Fire Pot',       price:30, r:13, wind:.8,  desc:'Bursts into burning pitch that eats stone for seconds.' },
  { id:'sapper',       name:'Sapper Charge',  price:40, r:30, wind:.5,  desc:'Digs into the earth, then blows up inside it.' },
  { id:'rockrain',     name:'Rock Rain',      price:55, r:10, wind:.6,  desc:'Where it lands, seven rocks fall from the sky.' },
  { id:'falcon',       name:'War Falcon',     price:60, r:22, wind:.3,  desc:'Hunts the nearest enemy castle once released.' },
  { id:'quake',        name:'Earthquake',     price:65, r:16, wind:.5,  desc:'Cracks the ground around the impact and shakes nearby castles. Shields do not stop it.' },
  { id:'storm',        name:'Storm Bolt',     price:70, r:30, wind:.7,  desc:'Calls lightning down on the spot where it lands.' },
  { id:'mg',           name:'Machine Gun',    price:0,  r:0,  wind:0, secret:true, desc:'Secret. Fires straight for six seconds in any direction. Steer it while it fires.' },
  { id:'driller',      name:'Driller',        price:0,  r:26, wind:0, secret:true, imm:.5, desc:'Secret. Bores dead straight for ten seconds through hills and castles, then blows up.' },
  { id:'shiva',        name:"Shiva's Trishul", price:0, r:0,  wind:0, secret:true, unlock:'shiva', desc:'Secret. Shiva appears and tridents rain on every enemy castle, taking 90% of its strength. No aiming needed.' },
];
const ORIGINAL_COUNT = 10;
const SHOP_WEAPONS = WEAPONS.filter(w => !w.secret);
const owns = (p, id) => id === 'arrow' || (WEAP[id] && WEAP[id].secret ? !!p[WEAP[id].unlock || 'mg'] : p.inv[id] > 0);
// secret weapons can aim all the way round (down-slope too); everything else aims over the top
const wideAim = p => !!p && WEAP[p.weapon] && !!WEAP[p.weapon].secret;
const angRange = p => wideAim(p) ? [-90, 270] : [0, 180];
const clampAng = (p, a) => { const [lo, hi] = angRange(p); return clamp(a, lo, hi); };
function normAng(p, ang) { // atan2 degrees → the weapon's aim range
  if (wideAim(p)) return ang < -90 ? ang + 360 : ang;
  return ang < 0 ? (ang < -90 ? 180 : 0) : ang;
}

// ================= utils =================
function hash(x, y, s) {
  let h = (Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash(xi,yi,s), b = hash(xi+1,yi,s), c = hash(xi,yi+1,s), d = hash(xi+1,yi+1,s);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; }

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const Snd = {

    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(); o.type = type;

  return removed;
}
function killCastle(c, killer) {
  c.alive = false; c.collapse = .0001; c.shield = null;
  const cx = c.x, cy = c.y - c.h*.5;
  burst(cx, cy, 70, { kind:'debris', cols:stoneCols(), sp:320, up:300, spread:40 });
  burst(cx, cy, 18, { kind:'smoke', col:[120,110,100], sp:70, spread:40 });
  S.flashes.push({ x:cx, y:cy, r:130, t:0, dur:.4 });
  S.shake = Math.min(24, S.shake + 16); Snd.crumble();
  const who = killer && killer !== c.player ? killer : null;
  if (who) { who.money += 75; who.roundEarn += 75; who.kills++; float(cx, cy - 70, `+$75  ${c.player.name} razed`, '#f1cd73', 2.4); }

}
function flagAttached(c) { for (let y = 18; y < 26; y++) for (let x = 98; x <= 102; x++) if (c.mask[y*c.w + x]) return true; return false; }
function castleSupported(c) {
  if (c.y >= H - 1) return true;
  const left = c.x - c.w/2, top = c.y - c.h;
  for (let lx = 4; lx < c.w - 4; lx += 3) {
    for (let ly = c.h - 1; ly > c.h - 30; ly--) {
      if (c.mask[ly*c.w + lx]) { const wx = left + lx, wy = top + ly + 1; if (solidT(wx, wy) || solidT(wx, wy + 1)) return true; break; }
    }

}
function launchPoint(c, ang) { const a = ang*Math.PI/180; return { x: c.x + Math.cos(a)*18, y: c.y - LAUNCH_H - Math.sin(a)*18 }; }

// ================= particles & fx =================
function stoneCols() { const t = T.tint; return [[184,170,130],[150,138,104],[204,190,150],[118,108,82]].map(s => [s[0]*t[0], s[1]*t[1], s[2]*t[2]]); }
function burst(x, y, n, o) {
  for (let i = 0; i < n && S.parts.length < 1400; i++) {
    const a = rand(0, TAU), sp = rand(.2, 1)*(o.sp || 100);
    const p = { x: x + rand(-1, 1)*(o.spread || 0), y: y + rand(-1, 1)*(o.spread || 0)*.6, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - (o.up ? rand(.3, 1)*o.up : 0), kind:o.kind, rot:rand(0, 6), vr:rand(-12, 12) };
    if (o.kind === 'debris') { p.col = o.cols[(Math.random()*o.cols.length)|0]; p.life = p.max = rand(1.2, 2.6); p.size = rand(1.5, 4.2); p.g = G; }
    else if (o.kind === 'smoke') { p.col = o.col; p.life = p.max = rand(.9, 1.8); p.size = rand(6, 14); p.g = -30; p.vx *= .5; p.vy *= .5; }
    else if (o.kind === 'spark') { p.col = o.col || [255,220,140]; p.life = p.max = rand(.2, .55); p.size = rand(1, 2.2); p.g = 200; }
    else if (o.kind === 'ember') { p.col = o.col || [255,170,60]; p.life = p.max = rand(.5, 1.1); p.size = rand(1, 2.2); p.g = -40; }
    else if (o.kind === 'dust') { p.col = o.col; p.life = p.max = rand(.8, 1.6); p.size = rand(4, 10); p.g = -8; p.vx *= .4; p.vy *= .3; }
    S.parts.push(p);
  }
}
function float(x, y, text, col, dur = 1.7) { S.floats.push({ x:clamp(x, 90, W - 90), y:Math.max(40, y), text, col, t:0, dur }); }

function explode(x, y, r, owner, o = {}) {
  crater(x, y, r);
  let stone = false; S.earnAcc = 0;
  for (const c of S.castles) if (c.alive && c !== o.exclude && damageCastle(c, x, y, r, owner)) stone = true;
  if (S.earnAcc >= 1) float(x, y - r - 12, '+$' + Math.round(S.earnAcc), '#f1cd73');
  for (const g of S.gifts) if (!g.taken && Math.hypot(g.x - x, g.y - 8 - y) < r + 14) collectGift(g, owner);
  if (o.quiet) return;
  burst(x, y, Math.round(r*1.5), { kind:'debris', cols: stone ? stoneCols().concat(T.cols.slice(0, 2)) : T.cols, sp: 110 + r*7, up: 120 + r*4 });
  burst(x, y, Math.ceil(r/4), { kind:'smoke', col:[110,100,92], sp:40 + r, spread:r*.4 });
  burst(x, y, Math.ceil(r*.7), { kind:'spark', sp:200 + r*6 });
  S.flashes.push({ x, y, r:r*2.5, t:0, dur:.28 });
  S.shake = Math.min(20, S.shake + r*.38);
  Snd.boom(r);
}
function burnAt(x, y, r, owner) { crater(x, y, r); for (const c of S.castles) if (c.alive) damageCastle(c, x, y, r, owner); }

// ================= gifts =================
function spawnGift() {
  const gold = Math.random() < .5;
  const pool = SHOP_WEAPONS.filter(w => w.price > 0);
  const w = pick(pool);
  S.gifts.push({ x:rand(160, W - 160), y:-24, landed:false, taken:false, ph:rand(0, 6),
    kind: gold ? 'gold' : 'weapon', amount: gold ? 5*Math.round(rand(6, 18)) : (w.price >= 50 ? 1 : 2), wid: w.id });
}
function collectGift(g, owner) {
  if (g.taken || !owner) return;
  g.taken = true;
  if (g.kind === 'gold') { owner.money += g.amount; owner.roundEarn += g.amount; float(g.x, g.y - 30, `${owner.name} +$${g.amount}`, '#f1cd73', 2.2); }
  else { owner.inv[g.wid] = (owner.inv[g.wid] || 0) + g.amount; float(g.x, g.y - 30, `${owner.name} +${g.amount} ${WEAP[g.wid].name}`, '#f6e8c6', 2.4); }
  burst(g.x, g.y - 8, 24, { kind:'spark', col:[255,225,120], sp:180 });
  Snd.gift(); refreshTray();
}
function updateGift(g, dt) {
  if (!g.landed) {
    g.y += 40*dt; g.x += S.wind*.28*dt + Math.sin(S.time*1.6 + g.ph)*10*dt;
    if (g.y > H + 20) g.taken = true;
    else if (solidT(g.x, g.y + 1) || S.castles.some(c => c.alive && castlePix(c, g.x, g.y + 1))) g.landed = true;
  } else if (!solidT(g.x, g.y + 2) && !S.castles.some(c => c.alive && castlePix(c, g.x, g.y + 2))) g.landed = false;
}

// ================= projectiles =================
function newProj(type, x, y, vx, vy, owner) { return { type, x, y, vx, vy, owner, age:0, bounces:0, drill:0, dead:false, trail:[], slow:0, wait:0 }; }
function hitTest(x, y, pr) {
  if (y >= H) return { ground:true };
  if (x < 0 || x >= W || y < 0) return null;
  if (pr) {
    for (const c of S.castles) if (c.shield && c !== pr.owner.castle && inShield(c, x, y)) return { shield:c };
    for (const g of S.gifts) if (!g.taken && Math.abs(g.x - x) < 11 && y > g.y - 18 && y < g.y + 1) return { gift:g };
  }
  for (const c of S.castles) {
    if (!c.alive) continue;
    if (pr && pr.owner && c === pr.owner.castle && pr.age < (WEAP[pr.type].imm || .3)) continue;
    if (castlePix(c, x, y)) return { castle:c };
  }
  if (T.mask[(y|0)*W + (x|0)]) return { ground:true };
  return null;
}
function normalAt(x, y) {
  let sx = 0, sy = 0;
  for (let dy = -6; dy <= 6; dy++) for (let dx = -6; dx <= 6; dx++) if (dx*dx + dy*dy <= 36 && solidT(x + dx, y + dy)) { sx += dx; sy += dy; }
  const l = Math.hypot(sx, sy); return l ? { x: -sx/l, y: -sy/l } : { x:0, y:-1 };
}
function finish(pr) { pr.dead = true; if (pr.record) { pr.owner.lastPath = pr.record; pr.record = null; } }
function detonate(pr, exclude) { explode(pr.x, pr.y, WEAP[pr.type].r, pr.owner, { exclude }); finish(pr); }
function fizzle(pr) { burst(pr.x, pr.y, 5, { kind:'smoke', col:[150,145,140], sp:20 }); float(pr.x, pr.y - 20, 'Dud', '#e8dcc0', 1.2); finish(pr); }
function superBurst(pr) {
  explode(pr.x, pr.y, WEAP.supergrenade.r, pr.owner);
  for (let i = 0; i < 6; i++) { const m = newProj('mini', pr.x, pr.y - 4, rand(-170, 170), rand(-280, -90), pr.owner); m.age = .5; S.proj.push(m); }
  finish(pr);
}
function nearestFoe(pr) {
  let best = null, bd = 1e9;
  for (const c of S.castles) { if (!c.alive || c === pr.owner.castle) continue; const d = Math.hypot(c.x - pr.x, c.y - CASTLE_MID - pr.y); if (d < bd) { bd = d; best = c; } }
  return best;
}
function bounce(pr, ox, oy, rest) {
  pr.x = ox; pr.y = oy;
  const nm = normalAt(pr.x, pr.y), d = pr.vx*nm.x + pr.vy*nm.y;
  if (d < 0) { pr.vx -= 2*d*nm.x; pr.vy -= 2*d*nm.y; }
  pr.vx *= rest; pr.vy *= rest; pr.x += nm.x*1.5; pr.y += nm.y*1.5; pr.bounces++;
  const sp = Math.hypot(pr.vx, pr.vy);
  if (sp > 70) { burst(pr.x, pr.y, 5, { kind:'debris', cols:T.cols, sp:90, up:60 }); Snd.bounce(sp); }
  if (sp < 45) pr.slow++;
}

function updateProj(pr, dt) {
  if (pr.wait > 0) { pr.wait -= dt; return; }
  pr.age += dt;
  const wp = WEAP[pr.type];
  if (pr.drill > 0) {
    pr.drill -= dt;
    const n = Math.max(1, Math.ceil(Math.hypot(pr.vx, pr.vy)*dt/3));
    for (let k = 0; k < n; k++) {
      pr.x += pr.vx*dt/n; pr.y += pr.vy*dt/n;
      const h = hitTest(pr.x, pr.y, pr);
      if (h && (h.castle || h.shield)) { if (pr.type === 'gimlet') { Snd.thud(); finish(pr); } else detonate(pr, h.shield); return; }
    }
    crater(pr.x, pr.y, pr.type === 'gimlet' ? 11 : 8);
    if (Math.random() < .7) burst(pr.x, pr.y, 2, { kind:'debris', cols:T.cols, sp:90, up:60 });
    if (pr.drill <= 0 || pr.x < 0 || pr.x >= W || pr.y >= H - 2) {
      if (pr.type === 'gimlet') { burst(pr.x, pr.y, 6, { kind:'dust', col:[140,120,100], sp:30 }); finish(pr); } else detonate(pr);
    }
    return;
  }
  if (pr.type === 'driller') { updateDriller(pr, dt); return; }
  if (pr.type === 'trident') { updateTrident(pr, dt); return; }
  if (pr.type === 'supergrenade' && pr.age >= 2.5) { superBurst(pr); return; }
  if ((pr.type === 'grenade' || pr.type === 'ballgrenade') && (pr.age > 11 || pr.slow > 5)) { fizzle(pr); return; }
  if (pr.type === 'supergrenade' && pr.slow > 5) { pr.vx = pr.vy = 0; return; }

  if (pr.type === 'bullet') { /* straight and fast */ }
  else if (pr.type === 'missile') {
    if (Math.random() < .9) burst(pr.x - pr.vx*.02, pr.y - pr.vy*.02, 1, { kind:'smoke', col:[200,195,190], sp:8 });
    if (Math.random() < .6) burst(pr.x - pr.vx*.025, pr.y - pr.vy*.025, 1, { kind:'ember', col:[255,190,80], sp:20 });
  } else if (pr.type === 'balloon') {
    pr.vy = pr.y > pr.alt ? lerp(pr.vy, -120, .06) : lerp(pr.vy, Math.sin(pr.age*2)*10, .05);
    pr.vx = pr.hs + S.wind*.6;
    // fires pellets nonstop once aloft, holding off only while still over its own castle
    const own = pr.owner.castle, firing = pr.age > .9 && pr.age < .9 + BALLOON_FIRE && pr.x > 0 && pr.x < W;
    if (firing) pr.dropT -= dt;
    if (firing && pr.dropT <= 0) {
      pr.dropT = BALLOON_RATE;
      if (!own || Math.abs(pr.x - own.x) > own.w/2 + 20) {
        const b = newProj('pellet', pr.x + rand(-3, 3), pr.y + 18, pr.vx*.9 + rand(-15, 15), 40, pr.owner); b.age = 1; S.proj.push(b);
        if (pr.drops++ % 3 === 0) Snd.pop();
      }
    }
    if (pr.age > .9 + BALLOON_FIRE + .3) { burst(pr.x, pr.y, 10, { kind:'smoke', col:[220,210,200], sp:40 }); Snd.pop(); finish(pr); return; }
  } else if (pr.type === 'falcon' && pr.age > .35 && pr.age < 7) {
    const tgt = nearestFoe(pr);
    let ang = Math.atan2(pr.vy, pr.vx);
    if (tgt) {
      const want = Math.atan2(tgt.y - CASTLE_MID - pr.y, tgt.x - pr.x);
      let d = want - ang; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
      ang += clamp(d, -3.4*dt, 3.4*dt);
    }
    const sp = lerp(Math.hypot(pr.vx, pr.vy), 330, .05);
    pr.vx = Math.cos(ang)*sp + S.wind*wp.wind*dt; pr.vy = Math.sin(ang)*sp;
  } else {
    pr.vx += S.wind*wp.wind*dt; pr.vy += G*(wp.grav || 1)*dt;
  }
  const n = Math.max(1, Math.ceil(Math.hypot(pr.vx, pr.vy)*dt/3));
  for (let k = 0; k < n; k++) {
    const ox = pr.x, oy = pr.y;
    pr.x += pr.vx*dt/n; pr.y += pr.vy*dt/n;
    if (pr.x < -260 || pr.x > W + 260 || pr.y > H + 50 || pr.y < -1800) { finish(pr); return; }
    const h = hitTest(pr.x, pr.y, pr);
    if (h) { impact(pr, h, ox, oy); if (pr.dead || pr.drill > 0) return; break; }
  }
  pr.trail.push(pr.x, pr.y); if (pr.trail.length > 20) pr.trail.splice(0, 2);
  if (pr.record) pr.record.push(pr.x, pr.y);
  if (pr.type === 'fire') { if (Math.random() < .8) burst(pr.x, pr.y, 1, { kind:'ember', sp:30 }); if (Math.random() < .3) burst(pr.x, pr.y, 1, { kind:'smoke', col:[70,60,55], sp:10 }); }
  else if ((pr.type === 'supergrenade') && Math.random() < .6) burst(pr.x + 5, pr.y - 9, 1, { kind:'spark', sp:40 });
  else if ((pr.type === 'storm') && Math.random() < .7) burst(pr.x, pr.y, 1, { kind:'spark', col:[170,210,255], sp:70 });
  else if (pr.type === 'quake' && Math.random() < .5) burst(pr.x, pr.y, 1, { kind:'ember', col:[255,140,60], sp:30 });
}

function impact(pr, h, ox, oy) {
  const t = pr.type;
  if (t === 'bullet') {
    if (h.shield) { burst(pr.x, pr.y, 3, { kind:'spark', col:[200,220,255], sp:120 }); finish(pr); return; }
    if (h.gift) collectGift(h.gift, pr.owner);
    crater(pr.x, pr.y, 5);
    let stone = false;
    for (const c of S.castles) if (c.alive && damageCastle(c, pr.x, pr.y, 5, pr.owner)) stone = true;
    burst(pr.x, pr.y, 2, { kind:'debris', cols: stone ? stoneCols() : T.cols, sp:120, up:80 });
    burst(pr.x, pr.y, 1, { kind:'spark', sp:140 });
    S.shake = Math.min(6, S.shake + .6);
    finish(pr); return;
  }
  if (h.shield) {
    const c = h.shield;
    if (t === 'gimlet' || t === 'grounddef') { finish(pr); burst(pr.x, pr.y, 6, { kind:'spark', col:[200,220,255], sp:80 }); return; }
    explode(pr.x, pr.y, WEAP[t].r || 12, pr.owner, { exclude:c });
    if (t === 'supergrenade') for (let i = 0; i < 6; i++) { const m = newProj('mini', pr.x, pr.y - 4, rand(-170, 170), rand(-280, -90), pr.owner); m.age = .5; S.proj.push(m); }
    burst(pr.x, pr.y, 20, { kind:'spark', col:HERALD[c.player.her].light ? hexRgb(HERALD[c.player.her].light) : [200,220,255], sp:200 });
    Snd.ding();
    if (--c.shield.hits <= 0) { c.shield = null; float(c.x, c.y - 180, 'Shield broken', '#f6e8c6'); }
    finish(pr); return;
  }
  const solidHit = !!(h.castle || h.gift);
  if (h.gift) collectGift(h.gift, pr.owner);
  switch (t) {
    case 'grenade': case 'ballgrenade':
      if (solidHit) { detonate(pr); return; }
      bounce(pr, ox, oy, t === 'ballgrenade' ? .8 : .55); return;
    case 'supergrenade':
      if (solidHit) { superBurst(pr); return; }
      bounce(pr, ox, oy, .5); return;
    case 'gimlet':
      if (h.castle || h.gift) { Snd.thud(); finish(pr); return; }
      if (pr.y < H - 2) { const sp = Math.hypot(pr.vx, pr.vy) || 1; pr.vx = pr.vx/sp*200; pr.vy = pr.vy/sp*200; pr.drill = 1.5; Snd.ok() && Snd.noise(1.5, 300, 120, .25, 'bandpass', 3); return; }
      finish(pr); return;
    case 'sapper':
      if (h.ground && pr.y < H - 2) { const sp = Math.hypot(pr.vx, pr.vy) || 1; pr.vx = pr.vx/sp*230; pr.vy = pr.vy/sp*230; pr.drill = .75; Snd.ok() && Snd.noise(.8, 400, 150, .25, 'bandpass', 3); return; }
      detonate(pr); return;
    case 'fire':
      explode(pr.x, pr.y, WEAP.fire.r, pr.owner);
      for (let i = 0; i < 8; i++) S.fires.push({ x:pr.x, y:pr.y - 4, vx:rand(-150, 150), vy:rand(-230, -70), owner:pr.owner, life:rand(2.8, 3.6), burn:rand(.1, .3), landed:false, ph:rand(0, 6) });
      finish(pr); return;
    case 'storm':
      explode(pr.x, pr.y, 8, pr.owner, { quiet:true }); burst(pr.x, pr.y, 16, { kind:'spark', col:[170,210,255], sp:160 });
      S.strikes.push({ x:pr.x, t:0, owner:pr.owner, done:false, pts:null });
      finish(pr); return;
    case 'grounddef': mound(pr.x, pr.y); finish(pr); return;
    case 'pellet': {
      const hitStone = !!h.castle;
      explode(pr.x, pr.y, WEAP.pellet.r, pr.owner, { quiet:true });
      burst(pr.x, pr.y, 6, { kind:'debris', cols: hitStone ? stoneCols() : T.cols, sp:120, up:100 });
      burst(pr.x, pr.y, 3, { kind:'spark', sp:160 });
      S.flashes.push({ x:pr.x, y:pr.y, r:12, t:0, dur:.18 });
      S.shake = Math.min(7, S.shake + .8);
      if (Math.random() < .4) Snd.boom(5);
      finish(pr); return;
    }
    case 'rockrain':
      explode(pr.x, pr.y, WEAP.rockrain.r, pr.owner);
      for (let i = 0; i < 7; i++) { const r = newProj('rock', pr.x + rand(-95, 95), -30 - rand(0, 60), rand(-20, 20), rand(60, 140), pr.owner); r.age = 1; r.wait = .25 + i*.13; S.proj.push(r); }
      Snd.ok() && Snd.noise(1.2, 900, 200, .2, 'lowpass', .7, .2);
      finish(pr); return;
    case 'quake':
      explode(pr.x, pr.y, WEAP.quake.r, pr.owner);
      S.quakes.push({ x:pr.x, t:0, next:0, owner:pr.owner }); Snd.rumble();
      finish(pr); return;
    default: detonate(pr);
  }
}

function updateDivine(dt) {
  const d = S.divine; d.t += dt;
  if (!d.endT && d.t >= d.sendT) {
    d.sendT = d.t + .17;
    const f = d.foes.find(f => f.sent < SHIVA_TRIDENTS && f.c.alive);
    if (f) {
      f.sent++;
      const pr = newProj('trident', f.c.x + rand(-75, 75), -70 - rand(0, 60), 0, 900, d.owner);
      pr.foe = f; pr.hitY = f.c.y - rand(18, 100); pr.age = 1;
      S.proj.push(pr);
    } else if (!S.proj.some(q => q.type === 'trident')) d.endT = d.t;
  }
  if (d.endT && d.t - d.endT > 1.4) S.divine = null;
}
function groundY(x) { let y = 0; while (y < H && !solidT(x, y)) y += 3; return y; }
function updateTrident(pr, dt) {
  pr.vy += 500*dt; pr.y += pr.vy*dt;
  if (Math.random() < .8) burst(pr.x + rand(-3, 3), pr.y - 40, 1, { kind:'spark', col:[255,215,120], sp:30 });
  const f = pr.foe, hitY = f.c.alive ? pr.hitY : groundY(pr.x) - 4;
  if (pr.y >= hitY) tridentStrike(pr);
}
// Each trident takes an even share of the 90%: after the k-th of five, the castle's bar is at start - 0.9*k/5.
function tridentStrike(pr) {
  const f = pr.foe, c = f.c, owner = pr.owner; f.landed++;
  crater(pr.x, pr.y + 10, 14);
  if (c.alive) {
    const want = Math.max(0, f.start - SHIVA_DAMAGE*f.landed/SHIVA_TRIDENTS);
    S.earnAcc = 0;
    damageCastle(c, pr.x, pr.y, 16, owner);
    for (let guard = 0; c.alive && hpShown(c.hp) > want + 1e-4 && guard < 400; guard++) {
      let lx = 0, ly = 0, ok = false;
      for (let t = 0; t < 40 && !ok; t++) { lx = Math.floor(clamp(pr.x - (c.x - c.w/2) + rand(-85, 85), 0, c.w - 1)); ly = Math.floor(rand(0, c.h)); ok = c.mask[ly*c.w + lx] === 1; }
      if (!ok) for (let i = 0; i < c.mask.length && !ok; i++) if (c.mask[i]) { lx = i % c.w; ly = (i/c.w)|0; ok = true; }
      if (!ok) break;
      damageCastle(c, c.x - c.w/2 + lx + .5, c.y - c.h + ly + .5, 5, owner);
    }
    if (S.earnAcc >= 1) float(pr.x, pr.y - 60, '+$' + Math.round(S.earnAcc), '#f1cd73');
    burst(pr.x, pr.y, 26, { kind:'debris', cols:stoneCols(), sp:260, up:220 });
  } else burst(pr.x, pr.y, 18, { kind:'debris', cols:T.cols, sp:200, up:180 });
  burst(pr.x, pr.y, 22, { kind:'spark', col:[255,220,130], sp:280 });

function update(dt) {

  const wv = S.wind;
  for (const c of S.clouds) { c.x += (8 + wv*.35)*c.s*dt; if (c.x > CLOUD_W + 40) c.x = -330; if (c.x < -340) c.x = CLOUD_W + 30; }

  if (S.banner) { S.banner.t += dt; if (S.banner.t >= S.banner.dur) S.banner = null; }

    case 'intro': S.stateT -= dt; if (S.stateT <= 0) beginTurn(); break;

        if (S.charge) {

      for (let i = 0; i < S.proj.length; i++) { const pr = S.proj[i]; if (!pr.dead) updateProj(pr, dt); }
      S.proj = S.proj.filter(p => !p.dead);

      for (const st of S.strikes) updateStrike(st, dt); S.strikes = S.strikes.filter(s => s.t < .9);
      for (const q of S.quakes) updateQuake(q, dt); S.quakes = S.quakes.filter(q => q.t < 1.5);
      const busy = S.mg || S.divine || S.proj.length || S.fires.length || S.strikes.length || S.quakes.length || S.castles.some(c => c.falling || c.collapse > 0);
      if (busy) S.settle = 0; else if ((S.settle += dt) > .8) endTurn();
      break;
    }
    case 'roundEnd': S.stateT -= dt; if (S.stateT <= 0) { S.state = 'idle'; afterRound(); } break;
  }

  if (!cam.manual) {
    let fx = null;

      if (S.mg) { const c = S.mg.owner.castle; fx = c.x + Math.cos(S.mg.owner.angle*Math.PI/180)*420; }
      else if (S.divine && !S.proj.length) { const f = S.divine.foes.find(f => f.sent < SHIVA_TRIDENTS && f.c.alive) || S.divine.foes[S.divine.foes.length - 1]; if (f) fx = f.c.x; }
      else {
        const pr = S.proj.find(p => p.record && !p.dead) || S.proj.find(p => !p.dead && p.wait <= 0 && p.type !== 'bullet');
        if (pr) fx = pr.x; else if (S.strikes.length) fx = S.strikes[0].x; else if (S.quakes.length) fx = S.quakes[0].x;
      }
    } else if ((S.state === 'aim') && S.cur) {
      const c = S.cur.castle; fx = c.x + (Math.cos(S.cur.angle*Math.PI/180) >= 0 ? 280 : -280);
    }

  cam.x += (cam.target - cam.x)*Math.min(1, dt*(S.state === 'flight' ? 5 : 3));
  cam.x = camClamp(cam.x);
  if ((S.mmT = (S.mmT || 0) - dt) <= 0) { S.mmT = .4; buildMinimap(); }

        if (c.vy > 120) { burst(c.x, c.y, 24, { kind:'dust', col:[150,130,110], sp:80, spread:40 }); Snd.thud(); S.shake += 6; }
        c.vy = 0;

    } else if (c.collapse > 0) {
      c.collapse += dt/1.5;

    <div class="actions"><button class="btn" id="btnShopDone" type="button">Ride to battle</button><span style="color:var(--ink2)">Arrows are always free.</span></div>
  </div>`);
  ov.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.id, n = +b.dataset.n;
    if (id === 'upgrade') { if (p.money < UPGRADE_PRICE || p.upgrade >= UPGRADE_MAX) return; p.money -= UPGRADE_PRICE; p.upgrade++; }
    else { const w = WEAP[id]; if (p.money < w.price*n) return; p.money -= w.price*n; p.inv[id] = (p.inv[id] || 0) + n; }
    Snd.coin();
    const y = ov.scrollTop; showShop(p); ov.scrollTop = y; updateHUD();
  }));
  $('#btnShopDone').addEventListener('click', () => { Snd.click(); nextShop(); });
}
function showGameOver() {
  const sorted = S.players.slice().sort((a, b) => b.wins - a.wins || b.money - a.money);
  const champ = sorted[0]; S.winner = champ;
  showOv(`<div class="card" role="dialog" aria-labelledby="gtitle">
    <span class="eyebrow">The siege is over after ${S.rounds} rounds</span>
    <h1 id="gtitle" style="font-size:clamp(44px,8vw,72px)">${esc(champ.name)} is champion</h1>
    ${standingsTable(sorted, [
      ['Rounds won', p => p.wins],
      ['Castles razed', p => p.kills],
      ['Total damage', p => Math.round(p.dmgTotal*100) + '%'],
      ['Treasury', p => '$' + Math.floor(p.money)],
    ])}
    <div class="actions"><button class="btn" id="btnAgain" type="button">New siege</button></div>
  </div>`);
  $('#btnAgain').addEventListener('click', () => { Snd.click(); startDemo(); showMenu(); });
}
function togglePause(force) {
  if (S.mode !== 'game') return;
  const want = force !== undefined ? force : !S.paused;
  if (want && !ov.hidden) return;
  S.paused = want; S.drag = null; S.charge = null;
  if (want) {
    showOv(`<div class="card" role="dialog" aria-labelledby="ptitle" style="max-width:440px">
      <span class="eyebrow">Round ${S.round} of ${S.rounds}</span><h2 id="ptitle">Paused</h2>
      <div class="actions"><button class="btn" id="btnResume" type="button">Resume</button><button class="btn ghost" id="btnQuit" type="button">Leave the siege</button></div>
      <form class="codeform" id="codeForm" autocomplete="off">
        <label for="codeIn">Secret code</label>
        <div class="coderow"><input id="codeIn" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"><button type="submit" class="btn ghost">Enter</button></div>
        <p id="codeMsg" aria-live="polite"></p>
      </form></div>`);
    $('#codeForm').addEventListener('submit', e => {
      e.preventDefault();
      const v = $('#codeIn').value.toLowerCase().replace(/[^a-z]/g, '');
      if (v === 'shiva') { const had = S.players.some(q => q.type === 'human' && q.shiva); unlockShiva(); $('#codeMsg').textContent = had ? "Shiva's Trishul is already yours." : "Shiva's Trishul unlocked for every human lord. Find it at the end of the weapon bar."; }
      else if (v === 'machinegun') { const had = S.players.some(q => q.type === 'human' && q.mg); unlockMG(); $('#codeMsg').textContent = had ? 'The machine gun and driller are already yours.' : 'Machine gun and Driller unlocked for every human lord. Find them at the end of the weapon bar.'; }
      else $('#codeMsg').textContent = v ? 'Nothing happens.' : '';
      $('#codeIn').value = '';
    });
    $('#btnResume').addEventListener('click', () => togglePause(false)); $('#btnResume').focus();
    $('#btnQuit').addEventListener('click', () => { S.paused = false; startDemo(); showMenu(); });
  } else hideOv();
}

// ================= input =================
function unlock() { Snd.init(); }
window.addEventListener('pointerdown', unlock, { passive:true });
window.addEventListener('keydown', unlock);
function screenPoint(e) { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left)/r.width*VW, y:(e.clientY - r.top)/r.height*H }; }
function worldPoint(e) { const p = screenPoint(e); return { x:p.x + cam.x, y:p.y }; }
// the machine gun can be steered while it fires
function humanSteering() { return S.mode === 'game' && S.mg && S.mg.owner.type === 'human' && ov.hidden && !S.paused; }
const canAim = () => humanAiming() || humanSteering();
function aimAt(w) {
  const p = S.cur, c = p.castle;
  let ang = Math.atan2(c.y - LAUNCH_H - w.y, w.x - c.x)*180/Math.PI;
  p.angle = normAng(p, ang); updateHUD();
}
cv.addEventListener('contextmenu', e => { e.preventDefault(); if (canAim()) aimAt(worldPoint(e)); });

// Pointer: minimap jumps the view, a drag that starts at your own castle aims (slingshot), any other drag pans.
cv.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !ov.hidden) return;
  const sp = screenPoint(e), wp = worldPoint(e);
  let mode = 'pan';
  if (inMinimap(sp)) mode = 'mini';
  else if (humanSteering()) mode = 'steer';
  else if (humanAiming()) { const c = S.cur.castle; if (Math.hypot(wp.x - c.x, wp.y - (c.y - CASTLE_MID)) < 130) mode = 'aim'; }
  S.drag = { mode, sx:e.clientX, sy:e.clientY, cam0:cam.x, moved:false };
  if (mode === 'mini') { cam.manual = true; cam.target = camClamp((sp.x - MM.x)*W/MM_W - VW/2); }
  if (mode === 'steer') aimAt(wp);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  const d = S.drag;
  if (!d) { cv.style.cursor = inMinimap(screenPoint(e)) ? 'pointer' : 'crosshair'; return; }
  const dx = d.sx - e.clientX, dy = d.sy - e.clientY, len = Math.hypot(dx, dy);
  if (len > 6) d.moved = true;
  if (d.mode === 'mini') { const sp = screenPoint(e); cam.target = camClamp((sp.x - MM.x)*W/MM_W - VW/2); return; }
  if (d.mode === 'steer') { if (humanSteering()) aimAt(worldPoint(e)); return; }
  if (d.mode === 'pan') {
    if (!d.moved) return;
    const r = cv.getBoundingClientRect();
    cam.manual = true; cam.x = cam.target = camClamp(d.cam0 + dx*VW/r.width); cv.style.cursor = 'grabbing';
    return;
  }
  if (!humanAiming() || len < 8) return;
  const r = cv.getBoundingClientRect(), ref = Math.max(120, Math.min(r.width, r.height)*.5);
  const p = S.cur;
  p.angle = normAng(p, Math.atan2(dy, dx)*180/Math.PI); p.power = clamp(len/ref*100, 3, 100); updateHUD();
});
const endDrag = (fireIt, e) => {
  const d = S.drag; S.drag = null; cv.style.cursor = 'crosshair';
  if (!fireIt || !d) return;
  if (d.mode === 'aim' && d.moved && humanAiming()) fire();
  else if ((d.mode === 'pan' || d.mode === 'aim') && !d.moved && humanAiming() && e) aimAt(worldPoint(e)); // tap to point the sight
};
cv.addEventListener('pointerup', e => endDrag(true, e));
cv.addEventListener('pointercancel', () => endDrag(false));
cv.addEventListener('wheel', e => {
  if (!ov.hidden) return;
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  cam.manual = true; cam.target = camClamp(cam.target + d*1.4);
}, { passive:false });

angR.addEventListener('input', () => { if (!canAim()) return; sliderT = performance.now(); S.cur.angle = clampAng(S.cur, 180 - +angR.value); updateHUD(); });
powR.addEventListener('input', () => { if (!humanAiming()) return; sliderT = performance.now(); S.cur.power = +powR.value; updateHUD(); });
function nudge(k, d) {
  if (k === 'ang' ? !canAim() : !humanAiming()) return;
  const p = S.cur;
  if (k === 'ang') p.angle = clampAng(p, Math.round(p.angle) + d); else p.power = clamp(Math.round(p.power) + d, 1, 100);
  updateHUD();
}
// Hold-to-repeat for the step buttons. One shared repeater, so a missed "pointerup" can never leave a
// runaway timer behind; any release anywhere, losing focus, or the button going disabled stops it.
const repeater = { hold:0, rep:0, btn:null };
function stopRepeat() { clearTimeout(repeater.hold); clearInterval(repeater.rep); repeater.hold = repeater.rep = 0; repeater.btn = null; }
document.querySelectorAll('.step').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); stopRepeat();
    repeater.btn = b;
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
    nudge(b.dataset.k, +b.dataset.d);
    repeater.hold = setTimeout(() => {
      repeater.rep = setInterval(() => {
        if (repeater.btn !== b || b.disabled) { stopRepeat(); return; }
        nudge(b.dataset.k, +b.dataset.d);
      }, 60);
    }, 350);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, stopRepeat));
  b.addEventListener('contextmenu', e => e.preventDefault()); // long-press menu on phones
  b.addEventListener('click', e => { if (e.detail === 0) nudge(b.dataset.k, +b.dataset.d); }); // keyboard activation
});
window.addEventListener('pointerup', stopRepeat);
window.addEventListener('pointercancel', stopRepeat);
window.addEventListener('blur', stopRepeat);
document.addEventListener('visibilitychange', stopRepeat);
// sliders hand keyboard focus back so the arrow keys keep driving the sight, not the slider
[angR, powR].forEach(r => r.addEventListener('change', () => r.blur()));

// Typing "machinegun" unlocks the secret gun. Letter hotkeys that could start the code wait briefly first.
const CODES = { machinegun: () => unlockMG(), shiva: () => unlockShiva() };
const codeStarts = s => Object.keys(CODES).some(c => c.startsWith(s));
let cheatBuf = '', deferred = [], cheatTimer = 0;
function flushDeferred() { const d = deferred; deferred = []; cheatBuf = ''; d.forEach(f => f()); }
function handleKey(k, shift, repeat, e) {
  if (k === 'm' || k === 'M') { Snd.setMuted(!Snd.muted); soundIcon(); return; }
  if (k === 'Escape' || k === 'p' || k === 'P') { if (S.mode === 'game' && (ov.hidden || S.paused)) { togglePause(); e && e.preventDefault(); } return; }
  if (humanSteering()) {
    const p = S.cur, step = shift ? 5 : 2;
    if (k === 'ArrowLeft') p.angle = clampAng(p, p.angle + step);
    else if (k === 'ArrowRight') p.angle = clampAng(p, p.angle - step);
    else return;
    e && e.preventDefault(); updateHUD(); return;
  }
  if (!humanAiming()) {
    if (k === 'ArrowLeft' || k === 'ArrowRight') { cam.manual = true; cam.target = camClamp(cam.target + (k === 'ArrowLeft' ? -120 : 120)); e && e.preventDefault(); }
    return;
  }
  const p = S.cur, step = shift ? 5 : 1;
  let used = true;
  if (k === 'ArrowLeft') p.angle = clampAng(p, Math.round(p.angle) + step);
  else if (k === 'ArrowRight') p.angle = clampAng(p, Math.round(p.angle) - step);
  else if (k === 'ArrowUp') p.power = clamp(Math.round(p.power) + step, 1, 100);
  else if (k === 'ArrowDown') p.power = clamp(Math.round(p.power) - step, 1, 100);
  else if (k === ' ') { if (!repeat) { if (p.weapon === 'defense' || p.weapon === 'mg') fire(); else S.charge = { t:0 }; } }
  else if (k === 'Enter') { if (!repeat) fire(); }
  else if (/^[0-9]$/.test(k)) selectWeapon(WEAPONS[(+k + 9) % 10].id);
  else if (k === 'q' || k === 'Q') cycleWeapon(-1);
  else if (k === 'e' || k === 'E') cycleWeapon(1);
  else if (k === 'Home') { cam.manual = false; }
  else used = false;
  if (used) { e && e.preventDefault(); updateHUD(); }
}
window.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input:not([type=range]),select,textarea')) return;
  const k = e.key;
  if (S.mode === 'game' && /^[a-z]$/i.test(k) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    let nb = cheatBuf + k.toLowerCase();
    if (!codeStarts(nb)) { if (cheatBuf) flushDeferred(); nb = k.toLowerCase(); }
    if (codeStarts(nb)) {
      clearTimeout(cheatTimer);
      if (CODES[nb]) { deferred = []; cheatBuf = ''; CODES[nb](); return; }
      cheatBuf = nb; const shift = e.shiftKey;
      deferred.push(() => handleKey(k, shift, false, null));
      cheatTimer = setTimeout(flushDeferred, 700);
      return;
    }
  } else if (cheatBuf) flushDeferred();
  handleKey(k, e.shiftKey, e.repeat, e);
});
window.addEventListener('keyup', e => {
  if (e.key === ' ' && S.charge) { S.charge = null; if (humanAiming()) fire(); e.preventDefault(); }
});
$('#btnFire').addEventListener('click', () => { if (humanAiming()) fire(); });
$('#btnSound').addEventListener('click', () => { Snd.init(); Snd.setMuted(!Snd.muted); soundIcon(); });
// Full screen hides the browser's own bars, which matters most on a phone held sideways.
{
  const root = document.documentElement, btn = $('#btnFull');
  const req = root.requestFullscreen || root.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (req && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) btn.hidden = false;
  btn.addEventListener('click', async () => {
    try {
      if (isFull()) await exit.call(document);
      else {
        await req.call(root);
        try { await screen.orientation.lock('landscape'); } catch (_) {}
      }
    } catch (_) { btn.hidden = true; } // refused here (e.g. inside an embedded viewer); nothing else to do
  });
  const sync = () => btn.setAttribute('aria-label', isFull() ? 'Leave full screen' : 'Full screen');
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
}
$('#btnPause').addEventListener('click', () => togglePause());
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'game' && ov.hidden && !S.paused) togglePause(true); });
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe($('#stage'));

// ================= boot =================
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last)/1000; last = now; if (dt > .1) dt = .1;
  acc += dt; let steps = 0;
  while (acc >= DT && steps < 6) { update(DT); acc -= DT; steps++; }
  if (steps === 6) acc = 0;
  render(); requestAnimationFrame(frame);
}
soundIcon(); makeIcons(); fit(); startDemo(); showMenu();
if (document.fonts && document.fonts.load) { document.fonts.load("64px 'Pirata One'"); document.fonts.load("700 20px 'Alegreya Sans SC'"); }
requestAnimationFrame(frame);
})();
</script>
</body>
